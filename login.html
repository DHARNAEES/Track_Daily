<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Track Daily</title>
<meta name="theme-color" content="#1F6B4A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script>
  (function(){
    try { document.documentElement.classList.add(localStorage.getItem('vantage_theme') === 'dark' ? 'dark' : 'light'); }
    catch(e){ document.documentElement.classList.add('light'); }
  })();
</script>
<style>
  :root{
    --bg:#F5F3EE; --bg-elev:#FFFFFF; --surface:rgba(23,22,15,0.065);
    --border:rgba(23,22,15,0.14); --border-hi:rgba(23,22,15,0.24);
    --text:#17160F; --text-dim:#5B594C; --text-faint:#9B9788;
    --accent:#1F6B4A; --neg:#D6483F; --pos:#1F8B4A;
  }
  html.dark{
    --bg:#131209; --bg-elev:#211F16; --surface:rgba(241,239,230,0.10);
    --border:rgba(241,239,230,0.16); --border-hi:rgba(241,239,230,0.28);
    --text:#F1EFE6; --text-dim:#C4C1B1; --text-faint:#8B876F;
    --accent:#3FAF7E; --neg:#FF6B62; --pos:#3FC98A;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; background:var(--bg); color:var(--text); font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; }
  body{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
  .card{ width:100%; max-width:400px; background:var(--bg-elev); border:1px solid var(--border); border-radius:20px; padding:24px; display:flex; flex-direction:column; gap:16px; box-shadow:0 12px 28px -14px rgba(0,0,0,.25); }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand img{ width:44px; height:44px; border-radius:12px; }
  h1{ margin:0; font-size:20px; line-height:1.2; }
  .sub{ margin:0; font-size:12.5px; color:var(--text-dim); }
  .tabs{ display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:4px; background:var(--surface); border-radius:12px; }
  .tabs button{ border:0; background:transparent; color:var(--text-dim); font:inherit; font-size:13.5px; font-weight:600; padding:8px; border-radius:9px; cursor:pointer; }
  .tabs button[aria-selected="true"]{ background:var(--bg-elev); color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.12); }
  form{ display:flex; flex-direction:column; gap:12px; }
  label{ display:flex; flex-direction:column; gap:5px; font-size:12.5px; font-weight:600; color:var(--text-dim); }
  input{ font:inherit; font-size:14px; color:var(--text); background:var(--surface); border:1px solid var(--border-hi); border-radius:12px; padding:10px 14px; width:100%; }
  input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .msg{ margin:0; min-height:18px; font-size:12.5px; color:var(--neg); }
  .msg.info{ color:var(--text-dim); }
  .note{ margin:0; font-size:12px; color:var(--text-dim); background:var(--surface); border-radius:10px; padding:9px 12px; }
  .primary{ border:0; background:var(--accent); color:#fff; font:inherit; font-size:13.5px; font-weight:600; padding:11px 16px; border-radius:12px; cursor:pointer; }
  .primary:disabled{ opacity:.5; cursor:default; }
  .foot{ margin:0; font-size:11.5px; color:var(--text-faint); text-align:center; }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<main class="card">
  <div class="brand">
    <img src="icon.svg" alt="">
    <div>
      <h1>Track Daily</h1>
      <p class="sub" id="subtitle">Sign in to open your own tracker</p>
    </div>
  </div>

  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tabIn" aria-selected="true">Sign in</button>
    <button type="button" role="tab" id="tabUp" aria-selected="false">Create account</button>
  </div>

  <form id="formIn" novalidate>
    <label>Username
      <input id="inUser" autocomplete="username" autocapitalize="none" spellcheck="false">
    </label>
    <label>Password
      <input id="inPass" type="password" autocomplete="current-password">
    </label>
    <p class="msg" id="msgIn" role="alert"></p>
    <button class="primary" type="submit" id="btnIn">Sign in</button>
  </form>

  <form id="formUp" novalidate hidden>
    <label>Your name <span style="font-weight:400;color:var(--text-faint)">(optional)</span>
      <input id="upName" autocomplete="name" maxlength="40">
    </label>
    <label>Username
      <input id="upUser" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="24">
    </label>
    <label>Password
      <input id="upPass" type="password" autocomplete="new-password">
    </label>
    <label>Confirm password
      <input id="upPass2" type="password" autocomplete="new-password">
    </label>
    <p class="note" id="legacyNote" hidden>Transactions already saved in this browser will be moved into this account.</p>
    <p class="msg" id="msgUp" role="alert"></p>
    <button class="primary" type="submit" id="btnUp">Create account</button>
  </form>

  <p class="foot">Accounts and data stay on this device. Each account has its own separate data.</p>
</main>

<script src="auth.js"></script>
<script>
(function(){
  'use strict';
  const $ = id => document.getElementById(id);
  const goHome = () => location.replace('index.html');

  if (TD_AUTH.currentUser()) { goHome(); return; }

  function show(mode){
    const up = mode === 'up';
    $('formIn').hidden = up; $('formUp').hidden = !up;
    $('tabIn').setAttribute('aria-selected', String(!up));
    $('tabUp').setAttribute('aria-selected', String(up));
    $('subtitle').textContent = up ? 'Create your own private tracker' : 'Sign in to open your own tracker';
    $('legacyNote').hidden = !(up && TD_AUTH.hasUnclaimedLegacyData());
    $(up ? 'upUser' : 'inUser').focus();
  }
  $('tabIn').addEventListener('click', () => show('in'));
  $('tabUp').addEventListener('click', () => show('up'));

  async function run(btn, msgEl, work){
    btn.disabled = true; msgEl.className = 'msg info'; msgEl.textContent = 'Please wait…';
    try { await work(); goHome(); }
    catch(err){ msgEl.className = 'msg'; msgEl.textContent = err.message || 'Something went wrong'; btn.disabled = false; }
  }

  $('formIn').addEventListener('submit', e => {
    e.preventDefault();
    run($('btnIn'), $('msgIn'), () => TD_AUTH.signIn($('inUser').value, $('inPass').value));
  });
  $('formUp').addEventListener('submit', e => {
    e.preventDefault();
    run($('btnUp'), $('msgUp'), async () => {
      if ($('upPass').value !== $('upPass2').value) throw new Error('Passwords do not match');
      await TD_AUTH.signUp($('upUser').value, $('upPass').value, $('upName').value);
    });
  });

  // First visit on this device: start on "Create account".
  show(TD_AUTH.getUsers().length ? 'in' : 'up');
})();
</script>
</body>
</html>
